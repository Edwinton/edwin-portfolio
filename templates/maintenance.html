<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction · Edwin Tony</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://edwinton.github.io/edwin-portfolio/static/css/main.css" />
  
  <style>
    body { 
      background-color: var(--surface, #faf9f7) !important; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      margin: 0;
      font-family: var(--font, 'Inter', sans-serif);
    }

    .maintenance-card {
      background: var(--white, #ffffff) !important;
      border: 1px solid var(--border, #e5e5e0);
      border-radius: var(--r-lg, 14px);
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
      text-align: center;
      position: relative;
      z-index: 10;
      color: var(--ink, #1a1a1a);
      margin-top: 40px;
      margin-bottom: 40px;
      
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
    }

    .maintenance-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle 150px at var(--mouse-x, -500px) var(--mouse-y, -500px), rgba(255, 123, 0, 0.1), transparent 60%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .maintenance-card:hover::before { opacity: 1; }

    .maintenance-card > * { position: relative; z-index: 2; }

    .maintenance-card .eyebrow { color: var(--green-700) !important; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
    .maintenance-card h1 { color: var(--ink) !important; font-size: 1.8rem; margin-bottom: 8px; letter-spacing: -0.02em; }
    .maintenance-card p { color: var(--ink-soft) !important; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }

    .game-container { display: none; margin-top: 16px; }
    .game-container.active { display: block; }

    /* Memory Game Grid */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .card-slot {
      aspect-ratio: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all 0.3s ease;
      transform-style: preserve-3d;
    }
    .card-slot:hover { border-color: var(--green-500); }
    .card-slot.flipped { background: var(--white); border-color: var(--green-500); box-shadow: 0 4px 12px rgba(255,123,0,0.15); }
    .card-slot.matched { background: var(--green-100); border-color: var(--green-500); cursor: default; }
    .card-slot .content { opacity: 0; transition: opacity 0.2s; }
    .card-slot.flipped .content, .card-slot.matched .content { opacity: 1; }

    .controls { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
    .msg { font-size: 0.95rem; font-weight: bold; height: 20px; margin-top: 8px; }
    .win { color: var(--green-700); }

    .hidden { display: none !important; }
    .btn-small { padding: 8px 16px !important; font-size: 0.85rem !important; }
  </style>
</head>
<body>

  <a href="https://edwinton.github.io/edwin-portfolio/index.html" class="nav-logo" style="position: absolute; top: 24px; left: 24px; text-decoration: none; font-size: 1.2rem;">
    ET<span>.</span>
  </a>

  <main class="maintenance-card" id="magnetic-card">
    <div class="eyebrow" style="text-align: center;">SYSTEM UPGRADE</div>
    <h1>Under Maintenance</h1>
    <p>Play a quick game while I update the site!</p>

    <button class="btn btn-primary" id="start-btn" onclick="startGame()">Start Game</button>

    <div class="game-container" id="game-container">
      <p style="font-size: 0.85rem; color: var(--ink-mute); margin-bottom: 12px;">Find all 6 matching pairs.</p>
      
      <div class="grid" id="grid"></div>

      <div class="msg" id="message"></div>
      
      <button class="btn btn-primary btn-small" id="reset-btn" onclick="startGame()" style="display: none; margin-top: 16px;">Play Again</button>
    </div>
  </main>

  <script>
    const ICONS = ["🚀", "💻", "⚙️", "🎨", "🧠", "🔒"];
    let cards = [];
    let flipped = [];
    let matched = 0;
    let lockBoard = false;

    function initGame() {
      // Duplicate icons to make pairs
      cards = [...ICONS, ...ICONS].sort(() => Math.random() - 0.5);
      flipped = [];
      matched = 0;
      lockBoard = false;

      document.getElementById('start-btn').classList.add('hidden');
      document.getElementById('game-container').classList.add('active');
      document.getElementById('reset-btn').style.display = 'none';
      document.getElementById('message').innerText = "";
      
      buildGrid();
    }

    function startGame() {
      initGame();
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      cards.forEach((icon, index) => {
        const card = document.createElement('div');
        card.className = 'card-slot';
        card.dataset.index = index;
        card.dataset.icon = icon;
        card.innerHTML = `<span class="content">${icon}</span>`;
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      lockBoard = true;
      const [card1, card2] = flipped;

      if (card1.dataset.icon === card2.dataset.icon) {
        // Match
        card1.classList.add('matched');
        card2.classList.add('matched');
        matched++;
        flipped = [];
        lockBoard = false;

        if (matched === ICONS.length) {
          document.getElementById('message').innerText = "You found all pairs! 🎉";
          document.getElementById('message').className = "msg win";
          document.getElementById('reset-btn').style.display = 'inline-block';
        }
      } else {
        // No match
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flipped = [];
          lockBoard = false;
        }, 800);
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const card = document.getElementById("magnetic-card");
      const buttons = document.querySelectorAll("button, .btn");

      buttons.forEach(element => {
        element.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        element.addEventListener("mousemove", event => {
          const rect = element.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          element.style.transform = `translate3d(${(event.clientX - centerX) * 0.3}px, ${(event.clientY - centerY) * 0.3}px, 0)`;
        });
        element.addEventListener("mouseleave", () => { element.style.transform = ""; });
      });

      if (card) {
        card.addEventListener("mousemove", event => {
          const rect = card.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          
          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateY = ((x - centerX) / centerX) * 3;
          const rotateX = ((centerY - y) / centerY) * 3;
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)";
          card.style.setProperty('--mouse-x', '-500px');
          card.style.setProperty('--mouse-y', '-500px');
        });
      }
    });
  </script>
</body>
</html>
