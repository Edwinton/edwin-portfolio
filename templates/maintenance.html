<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction · Edwin Tony</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://edwinton.github.io/edwin-portfolio/static/css/main.css" />
  
  <style>
    /* Page background */
    body { 
      background-color: var(--surface, #faf9f7) !important; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      font-family: var(--font, 'Inter', sans-serif);
    }

    /* The Orange Card */
    .maintenance-card {
      background: linear-gradient(135deg, #ff7b00, #d65a00) !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--r-lg, 14px);
      padding: 48px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(214, 90, 0, 0.3);
      text-align: center;
      position: relative;
      z-index: 10;
      color: #ffffff;
      
      /* Setup for spotlight */
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
    }

    /* Spotlight Overlay */
    .maintenance-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle 200px at var(--mouse-x, -500px) var(--mouse-y, -500px), rgba(255, 255, 255, 0.2), transparent 60%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .maintenance-card:hover::before { opacity: 1; }

    /* Ensure text is above the glow */
    .maintenance-card > * { position: relative; z-index: 2; }

    .maintenance-card .eyebrow { color: rgba(255,255,255,0.8) !important; }
    .maintenance-card h1 { color: #ffffff !important; font-size: 2.5rem; margin-bottom: 16px; letter-spacing: -0.02em; }
    .maintenance-card p { color: rgba(255,255,255,0.9) !important; font-size: 1.1rem; margin-bottom: 24px; line-height: 1.6; }

    /* Game UI */
    .game-container { display: none; margin-top: 24px; }
    .game-container.active { display: block; }
    
    .instructions { font-size: 0.9rem; color: rgba(255,255,255,0.8) !important; margin-bottom: 16px; }

    .board { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .row { display: flex; justify-content: center; gap: 12px; align-items: center; }
    
    /* The peg slots */
    .slot {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer; transition: all 0.2s;
    }
    .slot:hover { border-color: #ffffff; }
    
    /* Colors */
    .slot.c1 { background: #ffffff; border-color: #ffffff; } /* White (since card is orange) */
    .slot.c2 { background: #1a1a1a; border-color: #1a1a1a; } /* Black */
    .slot.c3 { background: #ff9e40; border-color: #ff9e40; } /* Light Orange */
    .slot.c4 { background: transparent; border-color: #ffffff; } /* Hollow */
    
    /* Feedback pegs */
    .feedback { display: flex; gap: 4px; width: 40px; flex-wrap: wrap; justify-content: center; }
    .fb-peg { width: 10px; height: 10px; border-radius: 50%; background: transparent; border: 1px solid rgba(255,255,255,0.3); }
    .fb-peg.correct { background: #ffffff; border-color: #ffffff; }
    .fb-peg.partial { background: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.5); }

    /* Controls */
    .controls { display: flex; justify-content: center; gap: 16px; margin-top: 16px; }
    .color-picker { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .color-picker .slot { width: 32px; height: 32px; cursor: pointer; }
    .color-picker .slot.selected { transform: scale(1.2); box-shadow: 0 0 0 3px rgba(255,255,255,0.4); }

    .msg { font-size: 1.1rem; font-weight: bold; height: 24px; margin-top: 16px; }
    .win { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.8); }
    .lose { color: #1a1a1a; }

    /* Button Styling for orange card */
    .btn-primary { background: #ffffff !important; color: #d65a00 !important; }
    .btn-primary:hover { background: #fff3e0 !important; color: #d65a00 !important; }
    .btn-outline { border-color: rgba(255,255,255,0.5) !important; color: #ffffff !important; }
    .btn-outline:hover { border-color: #ffffff !important; background: rgba(255,255,255,0.1) !important; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <a href="https://edwinton.github.io/edwin-portfolio/index.html" class="nav-logo" style="position: absolute; top: 24px; left: 24px; text-decoration: none; font-size: 1.2rem;">
    ET<span>.</span>
  </a>

  <main class="maintenance-card" id="magnetic-card">
    <div class="eyebrow" style="text-align: center;">SYSTEM UPGRADE</div>
    <h1>Under Maintenance</h1>
    <p>I'm currently updating the portfolio to make it even better.<br>While you wait, play a quick game of Code Breaker!</p>
    
    <button class="btn btn-primary" id="start-btn" onclick="startGame()">Start Game</button>

    <div class="game-container" id="game-container">
      <p class="instructions">Guess the 4-color code. <br> <span style="color:#ffffff">■</span> = Right color, right spot. <span style="color:rgba(255,255,255,0.5)">■</span> = Right color, wrong spot.</p>
      
      <div class="board" id="board"></div>
      
      <div class="color-picker">
        <div class="slot c1 selected" onclick="selectColor(1, this)"></div>
        <div class="slot c2" onclick="selectColor(2, this)"></div>
        <div class="slot c3" onclick="selectColor(3, this)"></div>
        <div class="slot c4" onclick="selectColor(4, this)"></div>
      </div>

      <div class="controls">
        <button class="btn btn-outline" onclick="checkGuess()">Submit Guess</button>
      </div>

      <div class="msg" id="message"></div>
    </div>
  </main>

  <script>
    // GAME LOGIC
    const MAX_TRIES = 10;
    const COLORS = 4;
    let secretCode = [];
    let currentGuess = [];
    let currentRow = 0;
    let currentColor = 1;
    let gameActive = false;

    function initGame() {
      secretCode = Array.from({length: COLORS}, () => Math.floor(Math.random() * 4) + 1);
      currentGuess = Array(COLORS).fill(0);
      currentRow = 0;
      currentColor = 1;
      gameActive = true;

      document.getElementById('message').innerText = "";
      document.getElementById('message').className = "msg";
      document.getElementById('start-btn').classList.add('hidden');
      document.getElementById('game-container').classList.add('active');
      
      document.querySelectorAll('.color-picker .slot').forEach((s, i) => {
        s.className = `slot c${i+1}` + (i === 0 ? ' selected' : '');
      });

      buildBoard();
    }

    function startGame() {
      initGame();
    }

    function buildBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      
      for (let i = 0; i < MAX_TRIES; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = `row-${i}`;

        for (let j = 0; j < COLORS; j++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.id = `slot-${i}-${j}`;
          if (i === 0) {
            slot.style.cursor = 'pointer';
            slot.onclick = () => fillSlot(j);
          } else {
            slot.style.cursor = 'default';
          }
          row.appendChild(slot);
        }

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${i}`;
        row.appendChild(feedback);

        board.appendChild(row);
      }
    }

    function selectColor(c, el) {
      if (!gameActive) return;
      currentColor = c;
      document.querySelectorAll('.color-picker .slot').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
    }

    function fillSlot(index) {
      if (!gameActive) return;
      currentGuess[index] = currentColor;
      const slot = document.getElementById(`slot-${currentRow}-${index}`);
      slot.className = `slot c${currentColor}`;
    }

    function checkGuess() {
      if (!gameActive) return;
      
      if (currentGuess.includes(0)) {
        showMessage("Please fill all 4 slots.", "lose");
        return;
      }

      let exact = 0, partial = 0;
      let tempSecret = [...secretCode];
      let tempGuess = [...currentGuess];

      for (let i = 0; i < COLORS; i++) {
        if (tempGuess[i] === tempSecret[i]) {
          exact++;
          tempSecret[i] = null;
          tempGuess[i] = null;
        }
      }
      for (let i = 0; i < COLORS; i++) {
        if (tempGuess[i] !== null && tempSecret.includes(tempGuess[i])) {
          partial++;
          tempSecret[tempSecret.indexOf(tempGuess[i])] = null;
        }
      }

      const feedback = document.getElementById(`feedback-${currentRow}`);
      for (let i = 0; i < exact; i++) {
        const peg = document.createElement('div'); peg.className = 'fb-peg correct'; feedback.appendChild(peg);
      }
      for (let i = 0; i < partial; i++) {
        const peg = document.createElement('div'); peg.className = 'fb-peg partial'; feedback.appendChild(peg);
      }
      for (let i = exact + partial; i < COLORS; i++) {
        const peg = document.createElement('div'); peg.className = 'fb-peg'; feedback.appendChild(peg);
      }

      if (exact === COLORS) {
        gameActive = false;
        showMessage("You cracked the code! 🎉", "win");
        document.getElementById('start-btn').innerText = "Play Again";
        document.getElementById('start-btn').classList.remove('hidden');
        return;
      }

      currentRow++;
      currentGuess = Array(COLORS).fill(0);

      if (currentRow >= MAX_TRIES) {
        gameActive = false;
        showMessage(`Game Over. The code was: ${secretCode.join(" - ")}`, "lose");
        document.getElementById('start-btn').innerText = "Try Again";
        document.getElementById('start-btn').classList.remove('hidden');
        return;
      }

      for (let j = 0; j < COLORS; j++) {
        const nextSlot = document.getElementById(`slot-${currentRow}-${j}`);
        nextSlot.style.cursor = 'pointer';
        nextSlot.onclick = () => fillSlot(j);
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.innerText = text;
      msg.className = `msg ${type}`;
    }

    // 3D TILT & GLOW EFFECTS
    document.addEventListener("DOMContentLoaded", function() {
      const card = document.getElementById("magnetic-card");
      const buttons = document.querySelectorAll("button, .btn");

      // Magnetic Buttons
      buttons.forEach(element => {
        element.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        element.addEventListener("mousemove", event => {
          const rect = element.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          element.style.transform = `translate3d(${(event.clientX - centerX) * 0.3}px, ${(event.clientY - centerY) * 0.3}px, 0)`;
        });
        element.addEventListener("mouseleave", () => { element.style.transform = ""; });
      });

      // 3D Tilt + Spotlight Glow on Card
      if (card) {
        card.addEventListener("mousemove", event => {
          const rect = card.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          
          // Move the spotlight
          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);

          // Apply 3D tilt
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateY = ((x - centerX) / centerX) * 4;
          const rotateX = ((centerY - y) / centerY) * 4;
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)";
          card.style.setProperty('--mouse-x', '-500px');
          card.style.setProperty('--mouse-y', '-500px');
        });
      }
    });
  </script>
</body>
</html>
