<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction · Edwin Tony</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://edwinton.github.io/edwin-portfolio/static/css/main.css" />
  
  <style>
    body { 
      background-color: var(--surface, #faf9f7) !important; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      font-family: var(--font, 'Inter', sans-serif);
    }

    .maintenance-card {
      background: var(--white, #ffffff) !important;
      border: 1px solid var(--border, #e5e5e0);
      border-radius: var(--r-lg, 14px);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
      text-align: center;
      position: relative;
      z-index: 10;
      color: var(--ink, #1a1a1a);
      
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
    }

    .maintenance-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle 200px at var(--mouse-x, -500px) var(--mouse-y, -500px), rgba(255, 123, 0, 0.1), transparent 60%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .maintenance-card:hover::before { opacity: 1; }

    .maintenance-card > * { position: relative; z-index: 2; }

    .maintenance-card .eyebrow { color: var(--green-700) !important; }
    .maintenance-card h1 { color: var(--ink) !important; font-size: 2rem; margin-bottom: 12px; letter-spacing: -0.02em; }
    .maintenance-card p { color: var(--ink-soft) !important; font-size: 1rem; margin-bottom: 24px; line-height: 1.5; }

    .game-container { display: none; margin-top: 16px; }
    .game-container.active { display: block; }
    
    .instructions { font-size: 0.85rem; color: var(--ink-mute) !important; margin-bottom: 16px; line-height: 1.6; }

    .board { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .row { display: flex; justify-content: center; gap: 8px; align-items: center; }
    
    .slot {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--border);
      cursor: pointer; transition: all 0.2s;
    }
    .slot:hover { border-color: var(--green-500); }
    
    .slot.c1 { background: #ff7b00; border-color: #ff7b00; }
    .slot.c2 { background: #1a1a1a; border-color: #1a1a1a; }
    .slot.c3 { background: #e5e5e0; border-color: #d6d6d0; }
    .slot.c4 { background: #ffffff; border-color: #cccccc; }
    
    .feedback { display: flex; gap: 3px; width: 32px; flex-wrap: wrap; justify-content: center; }
    .fb-peg { width: 8px; height: 8px; border-radius: 50%; background: transparent; border: 1px solid var(--border); }
    .fb-peg.correct { background: #1a1a1a; border-color: #1a1a1a; }
    .fb-peg.partial { background: #e5e5e0; border-color: #d6d6d0; }

    .controls { display: flex; justify-content: center; gap: 16px; margin-top: 16px; }
    .color-picker { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .color-picker .slot { width: 32px; height: 32px; cursor: pointer; }
    .color-picker .slot.selected { transform: scale(1.2); box-shadow: 0 0 0 3px var(--green-100); }

    .msg { font-size: 1rem; font-weight: bold; height: 24px; margin-top: 12px; }
    .win { color: var(--green-700); }
    .lose { color: #d65a00; }

    .hidden { display: none !important; }
    .btn-small { padding: 8px 16px !important; font-size: 0.85rem !important; }
  </style>
</head>
<body>

  <a href="https://edwinton.github.io/edwin-portfolio/index.html" class="nav-logo" style="position: absolute; top: 24px; left: 24px; text-decoration: none; font-size: 1.2rem;">
    ET<span>.</span>
  </a>

  <main class="maintenance-card" id="magnetic-card">
    <div class="eyebrow" style="text-align: center;">SYSTEM UPGRADE</div>
    <h1>Under Maintenance</h1>
    <p>Play a quick game while I update the site!</p>
    
    <!-- Reset button visible at all times -->
    <button class="btn btn-primary btn-small" id="reset-btn" onclick="startGame()" style="display: none; margin-bottom: 16px;">Play Again</button>

    <div class="game-container" id="game-container">
      <p class="instructions">
        Guess the 4-color code in 6 tries.<br>
        <span style="color:#1a1a1a">■</span> Right color, right spot. 
        <span style="color:#d6d6d0">■</span> Right color, wrong spot.
      </p>
      
      <div class="board" id="board"></div>
      
      <div class="color-picker">
        <div class="slot c1 selected" onclick="selectColor(1, this)"></div>
        <div class="slot c2" onclick="selectColor(2, this)"></div>
        <div class="slot c3" onclick="selectColor(3, this)"></div>
        <div class="slot c4" onclick="selectColor(4, this)"></div>
      </div>

      <div class="controls">
        <button class="btn btn-outline btn-small" onclick="checkGuess()">Submit Guess</button>
      </div>

      <div class="msg" id="message"></div>
    </div>
  </main>

  <script>
    const MAX_TRIES = 6; // Reduced to 6 so it fits on screen
    const COLORS = 4;
    let secretCode = [];
    let currentGuess = [];
    let currentRow = 0;
    let currentColor = 1;
    let gameActive = false;

    function initGame() {
      secretCode = Array.from({length: COLORS}, () => Math.floor(Math.random() * 4) + 1);
      currentGuess = Array(COLORS).fill(0);
      currentRow = 0;
      currentColor = 1;
      gameActive = true;

      document.getElementById('message').innerText = "";
      document.getElementById('message').className = "msg";
      document.getElementById('game-container').classList.add('active');
      document.getElementById('reset-btn').style.display = 'none'; // Hide reset when playing
      
      document.querySelectorAll('.color-picker .slot').forEach((s, i) => {
        s.className = `slot c${i+1}` + (i === 0 ? ' selected' : '');
      });

      buildBoard();
    }

    function startGame() {
      initGame();
    }

    function buildBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      
      for (let i = 0; i < MAX_TRIES; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = `row-${i}`;

        for (let j = 0; j < COLORS; j++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.id = `slot-${i}-${j}`;
          if (i === 0) {
            slot.style.cursor = 'pointer';
            slot.onclick = () => fillSlot(j);
          } else {
            slot.style.cursor = 'default';
          }
          row.appendChild(slot);
        }

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${i}`;
        row.appendChild(feedback);

        board.appendChild(row);
      }
    }

    function selectColor(c, el) {
      if (!gameActive) return;
      currentColor = c;
      document.querySelectorAll('.color-picker .slot').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
    }

    function fillSlot(index) {
      if (!gameActive) return;
      currentGuess[index] = currentColor;
      const slot = document.getElementById(`slot-${currentRow}-${index}`);
      slot.className = `slot c${currentColor}`;
    }

    function checkGuess() {
      if (!gameActive) return;
      
      if (currentGuess.includes(0)) {
        showMessage("Please fill all 4 slots.", "lose");
        return;
      }

      let exact = 0, partial = 0;
      let tempSecret = [...secretCode];
      let tempGuess = [...currentGuess];

      for (let i = 0; i < COLORS; i++) {
        if (tempGuess[i] === tempSecret[i]) {
          exact++;
          tempSecret[i] = null;
          tempGuess[i] = null;
        }
      }
      for (let i = 0; i < COLORS; i++) {
        if (tempGuess[i] !== null && tempSecret.includes(tempGuess[i])) {
          partial++;
          tempSecret[tempSecret.indexOf(tempGuess[i])] = null;
        }
      }

      const feedback = document.getElementById(`feedback-${currentRow}`);
      for (let i = 0; i < exact; i++) {
        const peg = document.createElement('div'); peg.className = 'fb-peg correct'; feedback.appendChild(peg);
      }
      for (let i = 0; i < partial; i++) {
        const peg = document.createElement('div'); peg.className = 'fb-peg partial'; feedback.appendChild(peg);
      }
      for (let i = exact + partial; i < COLORS; i++) {
        const peg = document.createElement('div'); peg.className = 'fb-peg'; feedback.appendChild(peg);
      }

      if (exact === COLORS) {
        gameActive = false;
        showMessage("You cracked the code! 🎉", "win");
        document.getElementById('reset-btn').style.display = 'inline-block'; // Show reset button
        return;
      }

      currentRow++;
      currentGuess = Array(COLORS).fill(0);

      if (currentRow >= MAX_TRIES) {
        gameActive = false;
        showMessage(`Game Over. Code: ${secretCode.join(" - ")}`, "lose");
        document.getElementById('reset-btn').style.display = 'inline-block';
        return;
      }

      for (let j = 0; j < COLORS; j++) {
        const nextSlot = document.getElementById(`slot-${currentRow}-${j}`);
        nextSlot.style.cursor = 'pointer';
        nextSlot.onclick = () => fillSlot(j);
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.innerText = text;
      msg.className = `msg ${type}`;
    }

    // 3D TILT & GLOW EFFECTS
    document.addEventListener("DOMContentLoaded", function() {
      const card = document.getElementById("magnetic-card");
      const buttons = document.querySelectorAll("button, .btn");

      buttons.forEach(element => {
        element.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        element.addEventListener("mousemove", event => {
          const rect = element.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          element.style.transform = `translate3d(${(event.clientX - centerX) * 0.3}px, ${(event.clientY - centerY) * 0.3}px, 0)`;
        });
        element.addEventListener("mouseleave", () => { element.style.transform = ""; });
      });

      if (card) {
        card.addEventListener("mousemove", event => {
          const rect = card.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          
          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateY = ((x - centerX) / centerX) * 3;
          const rotateX = ((centerY - y) / centerY) * 3;
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)";
          card.style.setProperty('--mouse-x', '-500px');
          card.style.setProperty('--mouse-y', '-500px');
        });
      }
    });
  </script>
</body>
</html>
