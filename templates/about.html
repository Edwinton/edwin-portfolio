<section class="section page-section">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">{{ page.eyebrow }}</p>
      <h2>{{ page.heading }}</h2>
    </div>

    <div class="about-layout">
      <div class="about-text">{{ page.paragraphs_html }}</div>

      <aside class="profile-card">
        <div class="profile-card-head">
          <div class="profile-card-avatar">{{ page.profile.initials }}</div>
          <div>
            <h3 class="profile-card-name">{{ page.profile.name }}</h3>
            <p class="profile-card-role">{{ page.profile.role }}</p>
          </div>
        </div>

        <p class="profile-card-status">{{ page.profile.status }}</p>

        <dl class="profile-card-facts">
          {{ page.profile.facts_html }}
        </dl>

        <div class="profile-card-links">
          <!-- Hardcoded icons to prevent Python escaping bugs -->
          <a class="profile-card-link" href="mailto:edwinvedon@gmail.com">
            <span style="display:inline-block; margin-bottom: 4px;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
            </span>
            <span>Email</span>
          </a>
          <a class="profile-card-link" href="https://github.com/Edwinton" target="_blank" rel="noopener">
            <span style="display:inline-block; margin-bottom: 4px;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            </span>
            <span>GitHub</span>
          </a>
          <a class="profile-card-link" href="https://www.linkedin.com/in/edwin-tony-267977393/" target="_blank" rel="noopener">
            <span style="display:inline-block; margin-bottom: 4px;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
            </span>
            <span>LinkedIn</span>
          </a>
        </div>
      </aside>
    </div>
  </div>
</section>
