<!DOCTYPE html>
<html lang="en">
<head>
  <base href="{{ base_url }}/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/main.css" />
  <link rel="stylesheet" href="static/css/sections.css" />
  <link rel="stylesheet" href="static/css/projects.css" />
  <link rel="stylesheet" href="static/css/cv.css" />
  <link rel="stylesheet" href="static/css/cv-print.css" media="print" />
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof CursorSwarm !== 'undefined') {
        new CursorSwarm({ 
          cursors: 4, 
          palette: 'mono:#2d5a3d',
          startPosition: 'outside',
          exitAfterBuild: 'home'
        }).init();
      }
    });
  </script>
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">ET<span>.</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        {{ nav_items }}
      </ul>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><span class="footer-logo">ET<span>.</span></span> &nbsp;·&nbsp; &copy; <span id="year"></span> {{ site.name }}</p>
      <a href="#" class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Back to top ↑</a>
    </div>
  </footer>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  

  <script src="static/js/main.js"></script>
  <script>
    // Delay slightly to ensure the DOM is fully painted
    setTimeout(function() {
      if (typeof CursorSwarm !== 'undefined') {
        window.swarm = new CursorSwarm({ 
          cursors: 5, 
          palette: 'neon',
          startPosition: 'center',
          respectReducedMotion: false,
          hud: false
        }).init();
        console.log("CursorSwarm initialized!");
      } else {
        console.error("CursorSwarm library not found.");
      }
    }, 100);
  </script>
  <script>
    setTimeout(function() {
      if (typeof CursorSwarm !== 'undefined') {
        window.swarm = new CursorSwarm({ 
          cursors: 5, 
          palette: 'neon',
          startPosition: 'center',
          respectReducedMotion: false,
          hud: false,
          onDone: function() {
            // Wait 1 second after the last element is built, then destroy the swarm completely
            setTimeout(function() {
              window.swarm.destroy();
            }, 1000);
          }
        }).init();
      }
    }, 100);
  </script>
  <script>
    // Only initialize ScrollReveal after the DOM is ready
    document.addEventListener("DOMContentLoaded", function() {
      // Wait a few seconds for CursorSwarm to finish its initial build, 
      // so they don't fight each other
      setTimeout(function() {
        ScrollReveal().reveal('.project-card, .skill-card, .timeline-item, .contact-card', {
          delay: 200,
          distance: '30px',
          duration: 800,
          easing: 'cubic-bezier(0.5, 0, 0, 1)',
          origin: 'bottom',
          interval: 100, // Adds a nice stagger effect between cards
          reset: false   // Only animate once
        });
      }, 2500); // 2.5 second delay lets the cursors do their thing first
    });
  </script>
  <script>
    setTimeout(function() {
      if (typeof CursorSwarm !== 'undefined') {
        window.swarm = new CursorSwarm({ 
          cursors: 3, 
          palette: 'neon',
          startPosition: 'center',
          respectReducedMotion: false,
          hud: false
        }).init();
        
        // Safety: Force the swarm to disappear after 3.5 seconds no matter what
        setTimeout(function() {
          window.swarm.destroy();
        }, 3500);
      }
    }, 100);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        // Only apply to elements further down the page, NOT the hero buttons
        ScrollReveal().reveal('.project-card, .skill-card, .timeline-item, .contact-card', {
          delay: 200,
          distance: '20px',
          duration: 600,
          origin: 'bottom',
          interval: 100,
          reset: false
        });
      }, 3500); // Start scrolling animations only AFTER the swarm has vanished
    });
  </script>
  <!-- CursorSwarm Animation -->
  <script src="static/js/cursor-swarm.js"></script>
  <script>
    setTimeout(function() {
      if (typeof CursorSwarm !== 'undefined') {
        window.swarm = new CursorSwarm({ 
          cursors: 4, 
          palette: 'neon',
          startPosition: 'outside',
          respectReducedMotion: false,
          deconstruct: false,      // Prevents reversing when scrolling up!
          hud: false,
          onDone: function() {
            // The moment the visible page is built, destroy the cursors entirely
            setTimeout(function() {
              if (window.swarm) {
                window.swarm.destroy();
              }
            }, 800); 
          }
        }).init();
        
        // Fail-safe: destroy after 4 seconds no matter what
        setTimeout(function() {
          if (window.swarm && window.swarm.state !== 'destroyed') {
            window.swarm.destroy();
          }
        }, 4000);
      }
    }, 100);
  </script>

  <!-- ScrollReveal Animation (for cards and content) -->
  <script src="https://unpkg.com/scrollreveal"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Only apply to elements further down, NOT the hero buttons
      ScrollReveal().reveal('.project-card, .skill-card, .timeline-item, .contact-card', {
        delay: 200,
        distance: '20px',
        duration: 600,
        origin: 'bottom',
        interval: 100,
        reset: false
      });
    });
  </script>
</body>
</html>
