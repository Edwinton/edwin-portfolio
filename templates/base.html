<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Stylesheets -->
  <base href="{{ base_url }}/">
  <link rel="stylesheet" href="static/css/main.css" />
  <link rel="stylesheet" href="static/css/sections.css" />
  <link rel="stylesheet" href="static/css/projects.css" />
  <link rel="stylesheet" href="static/css/cv.css" />
  <link rel="stylesheet" href="static/css/cv-print.css" media="print" />
  <link rel="stylesheet" href="static/css/motion.css" />

  <style>
    body { animation: page-enter .65s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes page-enter { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        {{ nav_items }}
      </ul>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><span class="footer-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></span> &nbsp;·&nbsp; {{ site.footer.copyright_html }}</p>
      <a href="#" class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">{{ site.footer.back_to_top_label }}</a>
    </div>
  </footer>

  <!-- Core JavaScript and page motion -->
  <script src="static/js/main.js"></script>
  <script src="static/js/cursor-swarm.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const revealItems = document.querySelectorAll('.hero-text > *, .hero-card, .section-head, .project-card, .skill-card, .profile-card, .timeline-content, .contact-card');
      if (!reduceMotion && 'IntersectionObserver' in window) {
        revealItems.forEach((item, index) => {
          item.classList.add('motion-reveal');
          item.style.setProperty('--reveal-delay', `${Math.min(index % 4, 3) * 70}ms`);
        });
        const observer = new IntersectionObserver(entries => entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        }), { threshold: 0.12, rootMargin: '0px 0px -35px 0px' });
        revealItems.forEach(item => observer.observe(item));
      }

      if (!reduceMotion && matchMedia('(pointer: fine)').matches) {
        document.querySelectorAll('.project-card, .skill-card, .profile-card, .contact-card').forEach(card => {
          card.addEventListener('pointermove', event => {
            const rect = card.getBoundingClientRect();
            card.style.setProperty('--pointer-x', `${event.clientX - rect.left}px`);
            card.style.setProperty('--pointer-y', `${event.clientY - rect.top}px`);
          });
        });
      }

      const cvDoc = document.getElementById('cvDoc');
      if (cvDoc && !reduceMotion && matchMedia('(pointer: fine)').matches) {
        cvDoc.addEventListener('pointermove', event => {
          const rect = cvDoc.getBoundingClientRect();
          cvDoc.style.setProperty('--tilt-x', `${((event.clientY - rect.top) / rect.height - .5) * -1.4}deg`);
          cvDoc.style.setProperty('--tilt-y', `${((event.clientX - rect.left) / rect.width - .5) * 1.4}deg`);
        });
        cvDoc.addEventListener('pointerleave', () => {
          cvDoc.style.setProperty('--tilt-x', '0deg');
          cvDoc.style.setProperty('--tilt-y', '0deg');
        });
      }

      const isCv = /(?:^|\/)cv\.html$/.test(location.pathname);
      const swarmRoot = isCv ? document.querySelector('#cvDoc') : document.querySelector('main');
      if (swarmRoot && typeof CursorSwarm !== 'undefined' && !reduceMotion) {
        if (isCv) document.querySelectorAll('.cv-table').forEach(table => table.setAttribute('data-cs', 'skip'));
        const swarm = new CursorSwarm({
          cursors: 3,
          palette: isCv ? 'mono:#2d5a3d' : 'forest',
          startPosition: 'outside',
          respectReducedMotion: true,
          hud: false,
          deconstruct: false,
          trigger: isCv ? 0.72 : 0.88,
          speed: isCv ? 2 : 1,
          typeDuration: isCv ? 0.65 : 1.6,
          root: swarmRoot,
          ignore: isCv ? 'table' : 'nav, footer',
          onDone: () => setTimeout(() => swarm.destroy(), 900)
        }).init();
        if (isCv && swarm.state === 'running') swarm.buildAll({ animate: true });
        if (!isCv && swarm.state === 'running') setTimeout(() => swarm.destroy(), 6500);
        if (isCv && swarm.state === 'running') setTimeout(() => swarm.destroy(), 12000);
      }
    });
  </script>
</body>
</html>
