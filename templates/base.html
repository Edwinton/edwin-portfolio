<!DOCTYPE html>
<html lang="en">
<head>
  <base href="{{ base_url }}/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/main.css" />
  <link rel="stylesheet" href="static/css/sections.css" />
  <link rel="stylesheet" href="static/css/projects.css" />
  <link rel="stylesheet" href="static/css/cv.css" />
  <link rel="stylesheet" href="static/css/cv-print.css" media="print" />
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof CursorSwarm !== 'undefined') {
        new CursorSwarm({ 
          cursors: 4, 
          palette: 'mono:#2d5a3d',
          startPosition: 'outside',
          exitAfterBuild: 'home'
        }).init();
      }
    });
  </script>
  <style>
    /* Hide default cursor on desktop */
    @media (pointer: fine) {
      body, a, button, .btn, .project-card, .skill-card, .profile-card, .timeline-content, .contact-card {
        cursor: none !important;
      }
    }
    
    /* The main custom cursor */
    .custom-cursor {
      position: fixed;
      top: 0; left: 0;
      width: 24px; height: 24px;
      background-image: url('static/img/cursor.png');
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease-out;
      display: none;
    }
  </style>
  <style>
    /* Custom Cursor (Desktop only) */
    @media (pointer: fine) {
      body, a, button, .btn, .project-card, .skill-card, .profile-card, .timeline-content, .contact-card {
        cursor: url('static/img/cursor.png'), auto !important;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">ET<span>.</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        {{ nav_items }}
      </ul>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><span class="footer-logo">ET<span>.</span></span> &nbsp;·&nbsp; &copy; <span id="year"></span> {{ site.name }}</p>
      <a href="#" class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Back to top ↑</a>
    </div>
  </footer>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  

  <script src="static/js/main.js"></script>
  <script>
    // Delay slightly to ensure the DOM is fully painted
    setTimeout(function() {
      if (typeof CursorSwarm !== 'undefined') {
        window.swarm = new CursorSwarm({ 
          cursors: 5, 
          palette: 'neon',
          startPosition: 'center',
          respectReducedMotion: false,
          hud: false
        }).init();
        console.log("CursorSwarm initialized!");
      } else {
        console.error("CursorSwarm library not found.");
      }
    }, 100);
  </script>
  <script>
    setTimeout(function() {
      if (typeof CursorSwarm !== 'undefined') {
        window.swarm = new CursorSwarm({ 
          cursors: 5, 
          palette: 'neon',
          startPosition: 'center',
          respectReducedMotion: false,
          hud: false,
          onDone: function() {
            // Wait 1 second after the last element is built, then destroy the swarm completely
            setTimeout(function() {
              window.swarm.destroy();
            }, 1000);
          }
        }).init();
      }
    }, 100);
  </script>
  <script>
    // Only initialize ScrollReveal after the DOM is ready
    document.addEventListener("DOMContentLoaded", function() {
      // Wait a few seconds for CursorSwarm to finish its initial build, 
      // so they don't fight each other
      setTimeout(function() {
        ScrollReveal().reveal('.project-card, .skill-card, .timeline-item, .contact-card', {
          delay: 200,
          distance: '30px',
          duration: 800,
          easing: 'cubic-bezier(0.5, 0, 0, 1)',
          origin: 'bottom',
          interval: 100, // Adds a nice stagger effect between cards
          reset: false   // Only animate once
        });
      }, 2500); // 2.5 second delay lets the cursors do their thing first
    });
  </script>
  <script>
    setTimeout(function() {
      if (typeof CursorSwarm !== 'undefined') {
        window.swarm = new CursorSwarm({ 
          cursors: 3, 
          palette: 'neon',
          startPosition: 'center',
          respectReducedMotion: false,
          hud: false
        }).init();
        
        // Safety: Force the swarm to disappear after 3.5 seconds no matter what
        setTimeout(function() {
          window.swarm.destroy();
        }, 3500);
      }
    }, 100);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        // Only apply to elements further down the page, NOT the hero buttons
        ScrollReveal().reveal('.project-card, .skill-card, .timeline-item, .contact-card', {
          delay: 200,
          distance: '20px',
          duration: 600,
          origin: 'bottom',
          interval: 100,
          reset: false
        });
      }, 3500); // Start scrolling animations only AFTER the swarm has vanished
    });
  </script>
  <script>
    setTimeout(function() {
      if (typeof CursorSwarm !== 'undefined') {
        window.swarm = new CursorSwarm({ 
          cursors: 4, 
          palette: 'neon',
          startPosition: 'outside',
          respectReducedMotion: false,
          deconstruct: false,      // Prevents reversing when scrolling up!
          hud: false,
          onDone: function() {
            // The moment the visible page is built, destroy the cursors entirely
            setTimeout(function() {
              if (window.swarm) {
                window.swarm.destroy();
              }
            }, 800); 
          }
        }).init();
        
        // Fail-safe: destroy after 4 seconds no matter what
        setTimeout(function() {
          if (window.swarm && window.swarm.state !== 'destroyed') {
            window.swarm.destroy();
          }
        }, 4000);
      }
    }, 100);
  </script>

  <!-- ScrollReveal Animation (for cards and content) -->
  <script src="https://unpkg.com/scrollreveal"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Only apply to elements further down, NOT the hero buttons
      ScrollReveal().reveal('.project-card, .skill-card, .timeline-item, .contact-card', {
        delay: 200,
        distance: '20px',
        duration: 600,
        origin: 'bottom',
        interval: 100,
        reset: false
      });
    });
  </script>
  <!-- Clean Load Animations -->
  <script src="https://unpkg.com/scrollreveal"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Fade in the hero section immediately
      ScrollReveal().reveal('.hero-text, .hero-card, .section-head', {
        delay: 100,
        distance: '30px',
        duration: 800,
        origin: 'bottom',
        interval: 100,
        reset: false
      });
      
      // Fade in lists and cards on scroll
      ScrollReveal().reveal('.project-card, .skill-card, .timeline-item, .contact-card, .profile-card', {
        delay: 200,
        distance: '20px',
        duration: 600,
        origin: 'bottom',
        interval: 100,
        reset: false
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof LiteUI !== 'undefined' && LiteUI.Magnetic) {
        new LiteUI.Magnetic('.btn', { 
          strength: 0.3,  // How strongly the button pulls (0.3 is a good subtle amount)
          radius: 80      // The distance around the button where the effect triggers
        });
      }
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof LiteUI !== 'undefined') {
        // 1. Apply Magnetic effect to buttons (subtle)
        if (LiteUI.Magnetic) {
          new LiteUI.Magnetic('.btn', { strength: 0.3, radius: 80 });
        }
        
        // 2. Apply 3D Tilt & Magnetic pull to cards
        if (LiteUI.Tilt) {
          new LiteUI.Tilt('.project-card, .skill-card, .profile-card, .timeline-content, .contact-card', {
            perspective: 1000, // Depth of the 3D effect
            maxTilt: 8,        // How far the card tilts (8 degrees is a nice subtle amount)
            scale: 1.02,       // Slight zoom on hover
            glare: true,       // Adds a subtle light reflection
            maxGlare: 0.2,     // Opacity of the glare
            transition: 0.2    // Speed of the snap-back
          });
        }
      }
    });
  </script>
  <!-- Custom 3D Tilt & Magnetic Buttons -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      
      // 1. Magnetic Buttons
      const buttons = document.querySelectorAll('.btn');
      buttons.forEach(btn => {
        btn.addEventListener('mousemove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          btn.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
        });
        btn.addEventListener('mouseleave', () => {
          btn.style.transform = `translate(0px, 0px)`;
          btn.style.transition = 'transform 0.3s ease'; // Smooth return
        });
        btn.addEventListener('mouseenter', () => {
          btn.style.transition = 'none'; // Instant follow
        });
      });

      // 2. 3D Tilt Cards
      const cards = document.querySelectorAll('.project-card, .skill-card, .profile-card, .timeline-content, .contact-card');
      cards.forEach(card => {
        card.style.transformStyle = 'preserve-3d';
        
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          // Calculate rotation based on mouse position (max 10 degrees)
          const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -10;
          const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 10;
          
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
          card.style.transition = 'transform 0.1s ease'; // Fast response
          card.style.boxShadow = '0 10px 30px rgba(0,0,0,0.1)';
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
          card.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
          card.style.boxShadow = '';
        });
        
        card.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });
      });

    });
  </script>
</body>
</html>
