<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" crossorigin="anonymous" />

  <!-- Absolute paths via base_url variable -->
  <link rel="stylesheet" href="https://edwinton.github.io/edwin-portfolio/static/css/main.css" />
  <link rel="stylesheet" href="https://edwinton.github.io/edwin-portfolio/static/css/sections.css" />
  <link rel="stylesheet" href="https://edwinton.github.io/edwin-portfolio/static/css/projects.css" />
  <link rel="stylesheet" href="https://edwinton.github.io/edwin-portfolio/static/css/cv.css" />
  <link rel="stylesheet" href="https://edwinton.github.io/edwin-portfolio/static/css/cv-print.css" media="print" />

  <style>
    body { opacity: 0; animation: fadeInPage 0.8s ease-in forwards; }
    @keyframes fadeInPage { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="{{ base_url }}/index.html" class="nav-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        {{ nav_items }}
      </ul>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><span class="footer-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></span> &nbsp;·&nbsp; {{ site.footer.copyright_html }}</p>
      <a href="#" class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">{{ site.footer.back_to_top_label }}</a>
    </div>
  </footer>

  <script src="{{ base_url }}/static/js/main.js"></script>
</body>
</html>
