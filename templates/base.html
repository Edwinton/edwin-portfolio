<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Stylesheets -->
  <base href="{{ base_url }}/">
  <link rel="stylesheet" href="static/css/main.css" />
  <link rel="stylesheet" href="static/css/sections.css" />
  <link rel="stylesheet" href="static/css/projects.css" />
  <link rel="stylesheet" href="static/css/cv.css" />
  <link rel="stylesheet" href="static/css/cv-print.css" media="print" />

  <style>
    /* Smooth page fade-in on load */
    body { opacity: 0; animation: fadeInPage 0.8s ease-in forwards; }
    @keyframes fadeInPage { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        {{ nav_items }}
      </ul>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><span class="footer-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></span> &nbsp;·&nbsp; {{ site.footer.copyright_html }}</p>
      <a href="#" class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">{{ site.footer.back_to_top_label }}</a>
    </div>
  </footer>

  <!-- Core JavaScript -->
  <script src="static/js/main.js"></script>
  <script>
    if (window.lucide) { lucide.createIcons(); }
  </script>

  <!-- Interactive Effects & Easter Eggs -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      
      // 1. 3D TILT EFFECT
      const cards = document.querySelectorAll('.project-card, .skill-card, .profile-card, .timeline-content, .contact-card');
      cards.forEach(card => {
        card.style.transformStyle = 'preserve-3d';
        card.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
        
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -6;
          const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 6;
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
          card.style.transition = 'transform 0.1s ease';
          card.style.boxShadow = '0 15px 35px rgba(255, 123, 0, 0.15)';
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
          card.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.5s ease';
          card.style.boxShadow = '';
        });
      });

      // 2. MAGNETIC BUTTONS & NAV
      const magneticElements = document.querySelectorAll('.btn, .nav-menu a, .back-top');
      magneticElements.forEach(el => {
        el.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        el.addEventListener('mousemove', (e) => {
          const rect = el.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          el.style.transition = 'none';
          el.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
        });
        el.addEventListener('mouseleave', () => {
          el.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          el.style.transform = `translate(0px, 0px)`;
        });
        el.addEventListener('mouseenter', () => { el.style.transition = 'none'; });
      });

      // 3. CV FLOW EFFECT
      const cvDoc = document.getElementById("cvDoc");
      if (cvDoc) {
        cvDoc.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        cvDoc.addEventListener('mousemove', (e) => {
          const rect = cvDoc.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          cvDoc.style.transition = 'transform 0.1s ease-out';
          cvDoc.style.transform = `translate(${x * 0.03}px, ${y * 0.03}px)`;
          cvDoc.style.boxShadow = '0 20px 40px rgba(0,0,0,0.08)';
        });
        cvDoc.addEventListener('mouseleave', () => {
          cvDoc.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.6s ease';
          cvDoc.style.transform = `translate(0px, 0px)`;
          cvDoc.style.boxShadow = '';
        });
      }

      // ==========================================
      // EASTER EGGS
      // ==========================================
      
      // 4. The Logo Spin (3 Clicks)
      let logoClicks = 0;
      const logo = document.querySelector('.nav-logo');
      if (logo) {
        logo.addEventListener('click', (e) => {
          logoClicks++;
          if (logoClicks === 3) {
            e.preventDefault();
            document.body.style.transition = 'transform 1s ease';
            document.body.style.transform = 'rotate(360deg)';
            setTimeout(() => { document.body.style.transform = 'none'; }, 1000);
            logoClicks = 0;
          }
        });
      }

      // 5. Type "hire"
      let keysPressed = "";
      document.addEventListener('keydown', (e) => {
        keysPressed += e.key.toLowerCase();
        if (keysPressed.includes("hire")) {
          keysPressed = "";
          const title = document.querySelector('.hero-text h1');
          if (title) {
            const originalText = title.innerText;
            title.innerText = "Hire Me? Let's Talk!";
            title.style.color = "#ff7b00";
            setTimeout(() => { title.innerText = originalText; title.style.color = ""; }, 2500);
          }
        }
        if (keysPressed.length > 10) keysPressed = keysPressed.slice(-5);
      });

      // 6. Double Click Confetti
      const footer = document.querySelector('.site-footer p');
      if (footer) {
        footer.addEventListener('dblclick', () => {
          for (let i = 0; i < 30; i++) {
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.width = '10px';
            confetti.style.height = '10px';
            confetti.style.backgroundColor = ['#ff7b00', '#d65a00', '#ff9e40', '#ffffff'][Math.floor(Math.random() * 4)];
            confetti.style.zIndex = '9999';
            confetti.style.transition = 'transform 2s linear, opacity 2s linear';
            document.body.appendChild(confetti);
            setTimeout(() => { confetti.style.transform = `translateY(100vh) rotate(${Math.random() * 360}deg)`; confetti.style.opacity = '0'; }, 50);
            setTimeout(() => confetti.remove(), 2000);
          }
        });
      }

      // 7. Konami Code
      let konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
      let konamiIndex = 0;
      document.addEventListener('keydown', (e) => {
        if (e.key === konamiCode[konamiIndex] || e.key.toLowerCase() === konamiCode[konamiIndex]) {
          konamiIndex++;
          if (konamiIndex === konamiCode.length) {
            document.body.style.transition = 'filter 1s ease';
            document.body.style.filter = 'invert(1) hue-rotate(180deg)';
            setTimeout(() => { document.body.style.filter = 'none'; }, 3000);
            konamiIndex = 0;
          }
        } else { konamiIndex = 0; }
      });

      // 8. Shift Trail
      let isDrawing = false;
      document.addEventListener('keydown', (e) => { if (e.key === 'Shift') isDrawing = true; });
      document.addEventListener('keyup', (e) => { if (e.key === 'Shift') isDrawing = false; });
      document.addEventListener('mousemove', (e) => {
        if (!isDrawing || Math.random() > 0.3) return;
        const dot = document.createElement('div');
        dot.style.position = 'fixed';
        dot.style.left = e.clientX + 'px';
        dot.style.top = e.clientY + 'px';
        dot.style.width = '10px'; dot.style.height = '10px';
        dot.style.backgroundColor = '#ff7b00';
        dot.style.borderRadius = '50%';
        dot.style.pointerEvents = 'none';
        dot.style.zIndex = '9999';
        dot.style.transition = 'opacity 1s ease';
        document.body.appendChild(dot);
        setTimeout(() => { dot.style.opacity = '0'; }, 10);
        setTimeout(() => { dot.remove(); }, 1000);
      });

      // 9. Type "matrix"
      let matrixKeys = "";
      document.addEventListener('keydown', (e) => {
        matrixKeys += e.key.toLowerCase();
        if (matrixKeys.includes("matrix")) {
          matrixKeys = "";
          const body = document.body;
          if (body.style.backgroundColor === 'black') {
            body.style.backgroundColor = ''; body.style.color = '';
          } else {
            body.style.backgroundColor = '#000'; body.style.color = '#0f0';
            body.style.transition = 'background-color 0.5s ease, color 0.5s ease';
            setTimeout(() => { body.style.backgroundColor = ''; body.style.color = ''; }, 4000);
          }
        }
        if (matrixKeys.length > 10) matrixKeys = matrixKeys.slice(-6);
      });

      // 10. Console Message
      console.log("%c👋 Hey there, curious developer!%c\n\nLooks like you know how to use DevTools. \nIf you're reading this, you're exactly the kind of person I want to work with.\n\nLet's build something great together.\n\n📧 edwinvedon@gmail.com", "font-size: 20px; font-weight: bold; color: #ff7b00;", "font-size: 14px; color: inherit;");

      // 11. Type "party"
      let partyKeys = "";
      document.addEventListener('keydown', (e) => {
        partyKeys += e.key.toLowerCase();
        if (partyKeys.includes("party")) {
          partyKeys = "";
          cards.forEach(card => { card.style.animation = 'shake 0.5s ease-in-out infinite'; });
          setTimeout(() => { cards.forEach(c => c.style.animation = ''); }, 3000);
        }
        if (partyKeys.length > 8) partyKeys = partyKeys.slice(-5);
      });

      // 12. Type "zoom"
      let zoomKeys = "";
      document.addEventListener('keydown', (e) => {
        zoomKeys += e.key.toLowerCase();
        if (zoomKeys.includes("zoom")) {
          zoomKeys = "";
          document.body.style.transition = 'transform 0.3s ease';
          document.body.style.transform = 'scale(1.1)';
          setTimeout(() => { document.body.style.transform = 'scale(1)'; }, 300);
          setTimeout(() => { document.body.style.transform = 'scale(0.9)'; }, 600);
          setTimeout(() => { document.body.style.transform = 'scale(1)'; }, 900);
        }
        if (zoomKeys.length > 8) zoomKeys = zoomKeys.slice(-4);
      });

      // 13. Right-click Logo
      if (logo) {
        logo.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const colors = ['#ff7b00', '#2d5a3d', '#1a2332', '#d65a00', '#ff9e40'];
          document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          setTimeout(() => { document.body.style.backgroundColor = 'var(--surface, #faf9f7)'; }, 2000);
        });
      }

      // 14. URL ?admin
      if (window.location.search.includes("?admin")) {
        const footer = document.querySelector('.footer-inner p');
        if (footer) footer.innerHTML += '<br><br><span style="color: #ff7b00; font-weight: bold;">🕵️ Secret Admin Mode Activated. Shh!</span>';
      }

    });
  </script>

  <!-- Expandable Orange Dot Cursor -->
  <style>
    @media (pointer: fine) {
      body, a, button, .btn, .project-card, .skill-card, .profile-card, .timeline-content, .contact-card {
        cursor: none !important; /* Hide default cursor */
      }
      input, textarea {
        cursor: text !important; /* Keep text cursor for typing */
      }
    }
    
    .custom-dot {
      position: fixed;
      top: 0; left: 0;
      width: 12px; height: 12px;
      background-color: #ff7b00;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      /* Smooth transition for the size change */
      transition: width 0.25s ease-out, height 0.25s ease-out, background-color 0.25s ease-out, opacity 0.2s ease;
      display: none;
      box-shadow: 0 0 10px rgba(255, 123, 0, 0.4);
    }
    
    /* The expanded state when hovering over a link/button */
    .custom-dot.hovering {
      width: 36px; height: 36px;
      background-color: rgba(255, 123, 0, 0.15);
      border: 2px solid #ff7b00;
      box-shadow: 0 0 20px rgba(255, 123, 0, 0.3);
    }
  </style>
  
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Only run on devices with a mouse
      if (window.matchMedia("(pointer: fine)").matches) {
        const dot = document.createElement("div");
        dot.className = "custom-dot";
        document.body.appendChild(dot);
        dot.style.display = "block";

        // Move the dot smoothly with the mouse
        document.addEventListener("mousemove", (e) => {
          dot.style.left = e.clientX + "px";
          dot.style.top = e.clientY + "px";
        });

        // Expand on interactive elements
        const hoverables = document.querySelectorAll("a, button, .btn, .project-card, .skill-card, .profile-card, .timeline-content, .contact-card");
        
        hoverables.forEach(el => {
          el.addEventListener("mouseenter", () => dot.classList.add("hovering"));
          el.addEventListener("mouseleave", () => dot.classList.remove("hovering"));
        });
      }
    });
  </script>
</body>
</html>
