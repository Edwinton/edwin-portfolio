<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Stylesheets -->
  <base href="{{ base_url }}/">
  <link rel="stylesheet" href="static/css/main.css" />
  <link rel="stylesheet" href="static/css/sections.css" />
  <link rel="stylesheet" href="static/css/projects.css" />
  <link rel="stylesheet" href="static/css/cv.css" />
  <link rel="stylesheet" href="static/css/cv-print.css" media="print" />

  <!-- Custom Cursor CSS -->
  <style>
    @media (pointer: fine) {
      body, a, button, .btn, .project-card, .skill-card, .profile-card, .timeline-content, .contact-card {
        cursor: url('static/img/cursor.png'), auto !important;
      }
    }
  </style>
  <style>
    /* Smooth page fade-in on load */
    body {
      opacity: 0;
      animation: fadeInPage 0.8s ease-in forwards;
    }
    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        {{ nav_items }}
      </ul>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><span class="footer-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></span> &nbsp;·&nbsp; {{ site.footer.copyright_html }}</p>
      <a href="#" class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">{{ site.footer.back_to_top_label }}</a>
    </div>
  </footer>

  <!-- Core JavaScript -->
  <script src="static/js/main.js"></script>
  <script>
    // Initialize Lucide Icons
    if (window.lucide) { lucide.createIcons(); }
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        if (typeof CursorSwarm !== 'undefined') {
          window.swarm = new CursorSwarm({ 
            cursors: 3, 
            palette: 'forest',
            startPosition: 'outside',
            respectReducedMotion: true,
            hud: false,
            deconstruct: false,
            onDone: function() {
              setTimeout(function() {
                if (window.swarm && window.swarm.state !== 'destroyed') {
                  window.swarm.destroy();
                }
              }, 500);
            }
          }).init();
          
          setTimeout(function() {
            if (window.swarm && window.swarm.state !== 'destroyed') {
              window.swarm.destroy();
            }
          }, 4000);
        }
      }, 100);
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      ScrollReveal().reveal('.project-card, .skill-card, .timeline-item, .contact-card, .profile-card', {
        delay: 200, distance: '20px', duration: 600, origin: 'bottom', interval: 100, reset: false
      });
    });
  </script>

  <!-- Magnetic Buttons -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const buttons = document.querySelectorAll('.btn');
      buttons.forEach(btn => {
        btn.addEventListener('mousemove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          btn.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
        });
        btn.addEventListener('mouseleave', () => {
          btn.style.transform = `translate(0px, 0px)`;
          btn.style.transition = 'transform 0.3s ease';
        });
        btn.addEventListener('mouseenter', () => {
          btn.style.transition = 'none';
        });
      });
    });
  </script>

  <!-- Interactive Effects: Tilt for Blocks, Magnetic for Elements -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      
      // ==========================================
      // 1. 3D TILT EFFECT (For Large Blocks)
      // ==========================================
      const cards = document.querySelectorAll('.project-card, .skill-card, .profile-card, .timeline-content, .contact-card');
      
      cards.forEach(card => {
        card.style.transformStyle = 'preserve-3d';
        card.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
        
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -6; // 6 degrees max tilt
          const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 6;
          
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
          card.style.transition = 'transform 0.1s ease';
          card.style.boxShadow = '0 15px 35px rgba(0,0,0,0.1)';
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
          card.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
          card.style.boxShadow = '';
        });
      });

      // ==========================================
      // 2. MAGNETIC EFFECT (For Small Elements)
      // ==========================================
      const magneticElements = document.querySelectorAll('.btn, .nav-menu a, .back-top');
      
      magneticElements.forEach(el => {
        el.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        
        el.addEventListener('mousemove', (e) => {
          const rect = el.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          
          // Strength of the magnet (0.3 is noticeable but not crazy)
          const strength = 0.3; 
          
          el.style.transition = 'none';
          el.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
        });

        el.addEventListener('mouseleave', () => {
          el.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          el.style.transform = `translate(0px, 0px)`;
        });
        
        el.addEventListener('mouseenter', () => {
          el.style.transition = 'none';
        });
      });

    });
  </script>
  <!-- CV Cursor Flow Effect -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const cvDoc = document.getElementById("cvDoc");
      
      if (cvDoc) {
        // Ensure smooth transition for the return to center
        cvDoc.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        
        cvDoc.addEventListener('mousemove', (e) => {
          const rect = cvDoc.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          
          // Subtle flow effect (moves max 10px in any direction)
          const strength = 0.03; 
          
          cvDoc.style.transition = 'transform 0.1s ease-out';
          cvDoc.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
          cvDoc.style.boxShadow = '0 20px 40px rgba(0,0,0,0.08)';
        });

        cvDoc.addEventListener('mouseleave', () => {
          // Snap back to center smoothly
          cvDoc.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.6s ease';
          cvDoc.style.transform = `translate(0px, 0px)`;
          cvDoc.style.boxShadow = '';
        });
        
        cvDoc.addEventListener('mouseenter', () => {
          cvDoc.style.transition = 'transform 0.1s ease-out';
        });
      }
    });
  </script>
</body>
</html>
