<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Stylesheets -->
  <base href="{{ base_url }}/">
  <link rel="stylesheet" href="static/css/main.css" />
  <link rel="stylesheet" href="static/css/sections.css" />
  <link rel="stylesheet" href="static/css/projects.css" />
  <link rel="stylesheet" href="static/css/cv.css" />
  <link rel="stylesheet" href="static/css/cv-print.css" media="print" />
  <link rel="stylesheet" href="static/css/motion.css" />

  <style>
    body { animation: page-enter .65s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes page-enter { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <!-- Custom Cursor -->
  <style>
    @media (pointer: fine) {
      body, a, button, .btn, .project-card, .skill-card, .profile-card, .timeline-content, .contact-card, input, textarea {
        cursor: url('static/img/cursor.png') 0 0, auto !important;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        {{ nav_items }}
      </ul>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><span class="footer-logo">{{ site.brand.wordmark }}<span>{{ site.brand.wordmark_accent }}</span></span> &nbsp;·&nbsp; {{ site.footer.copyright_html }}</p>
      <a href="#" class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">{{ site.footer.back_to_top_label }}</a>
    </div>
  </footer>

  <!-- Core JavaScript and page motion -->
  <script src="static/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const revealItems = document.querySelectorAll('.hero-text > *, .hero-card, .section-head, .project-card, .skill-card, .profile-card, .timeline-content, .contact-card');
      if (!reduceMotion && 'IntersectionObserver' in window) {
        revealItems.forEach((item, index) => {
          item.classList.add('motion-reveal');
          item.style.setProperty('--reveal-delay', `${Math.min(index % 4, 3) * 70}ms`);
        });
        const observer = new IntersectionObserver(entries => entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        }), { threshold: 0.12, rootMargin: '0px 0px -35px 0px' });
        revealItems.forEach(item => observer.observe(item));
      }

      if (!reduceMotion && matchMedia('(pointer: fine)').matches) {
        document.querySelectorAll('.project-card, .skill-card, .profile-card, .contact-card').forEach(card => {
          card.addEventListener('pointermove', event => {
            const rect = card.getBoundingClientRect();
            card.style.setProperty('--pointer-x', `${event.clientX - rect.left}px`);
            card.style.setProperty('--pointer-y', `${event.clientY - rect.top}px`);
          });
        });
      }

      const cvDoc = document.getElementById('cvDoc');
      if (cvDoc && !reduceMotion && matchMedia('(pointer: fine)').matches) {
        cvDoc.addEventListener('pointermove', event => {
          const rect = cvDoc.getBoundingClientRect();
          cvDoc.style.setProperty('--tilt-x', `${((event.clientY - rect.top) / rect.height - .5) * -1.4}deg`);
          cvDoc.style.setProperty('--tilt-y', `${((event.clientX - rect.left) / rect.width - .5) * 1.4}deg`);
        });
        cvDoc.addEventListener('pointerleave', () => {
          cvDoc.style.setProperty('--tilt-x', '0deg');
          cvDoc.style.setProperty('--tilt-y', '0deg');
        });
      }

      const isCv = /(?:^|\/)cv\.html$/.test(location.pathname);
      const swarmRoot = isCv ? document.querySelector('#cvDoc') : document.querySelector('main');
      if (swarmRoot && typeof CursorSwarm !== 'undefined' && !reduceMotion) {
        if (isCv) document.querySelectorAll('.cv-table').forEach(table => table.setAttribute('data-cs', 'skip'));
        const swarm = new CursorSwarm({
          cursors: 3,
          palette: isCv ? 'mono:#2d5a3d' : 'forest',
          startPosition: 'outside',
          respectReducedMotion: true,
          hud: false,
          deconstruct: false,
          trigger: isCv ? 0.72 : 0.88,
          speed: isCv ? 2 : 1,
          typeDuration: isCv ? 0.65 : 1.6,
          root: swarmRoot,
          ignore: isCv ? 'table' : 'nav, footer',
          onDone: () => setTimeout(() => swarm.destroy(), 900)
        }).init();
        if (isCv && swarm.state === 'running') swarm.buildAll({ animate: true });
        if (!isCv && swarm.state === 'running') setTimeout(() => swarm.destroy(), 6500);
        if (isCv && swarm.state === 'running') setTimeout(() => swarm.destroy(), 12000);
      }
    });
  </script>
  <!-- Custom CV Build Animation -->
  <style>
    .cv-mini-cursor {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #2d5a3d;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: top 0.4s ease, left 0.4s ease, opacity 0.2s ease;
      box-shadow: 0 0 10px rgba(45,90,61,0.5);
    }
    .cv-scan-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(45,90,61,0.05);
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (!window.location.pathname.includes("cv.html")) return;
      
      const cvDoc = document.getElementById("cvDoc");
      if (!cvDoc) return;

      // Make sure the CV is positioned relatively for the cursors
      cvDoc.style.position = "relative";

      const overlay = document.createElement("div");
      overlay.className = "cv-scan-overlay";
      cvDoc.appendChild(overlay);

      const cursors = [];
      for (let i = 0; i < 3; i++) {
        const c = document.createElement("div");
        c.className = "cv-mini-cursor";
        cvDoc.appendChild(c);
        cursors.push(c);
      }

      const sections = cvDoc.querySelectorAll(".cv-section");
      
      // Sequence the animation
      sections.forEach((sec, index) => {
        setTimeout(() => {
          const cursor = cursors[index % 3];
          
          // Move cursor to the section
          cursor.style.opacity = "1";
          cursor.style.top = `${sec.offsetTop + 10}px`;
          cursor.style.left = `${sec.offsetWidth - 30}px`; // Right side

          // Flash the overlay to simulate building
          overlay.style.top = `${sec.offsetTop}px`;
          overlay.style.height = `${sec.offsetHeight}px`;
          overlay.style.opacity = "1";
          
          setTimeout(() => { overlay.style.opacity = "0"; }, 200);
          setTimeout(() => { cursor.style.opacity = "0"; }, 400);
          
        }, index * 250); // Fast sequential scan
      });

      // Clean up everything after 2 seconds
      setTimeout(() => {
        cursors.forEach(c => c.remove());
        overlay.remove();
      }, 2500);
    });
  </script>
  <!-- Interactive Effects: Tilt, Magnetic, and CV Flow -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      
      // ==========================================
      // 1. 3D TILT EFFECT (For Large Blocks)
      // ==========================================
      const cards = document.querySelectorAll('.project-card, .skill-card, .profile-card, .timeline-content, .contact-card');
      
      cards.forEach(card => {
        card.style.transformStyle = 'preserve-3d';
        card.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
        
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -6;
          const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 6;
          
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
          card.style.transition = 'transform 0.1s ease';
          card.style.boxShadow = '0 15px 35px rgba(0,0,0,0.1)';
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
          card.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
          card.style.boxShadow = '';
        });
      });

      // ==========================================
      // 2. MAGNETIC EFFECT (For Small Elements)
      // ==========================================
      const magneticElements = document.querySelectorAll('.btn, .nav-menu a, .back-top');
      
      magneticElements.forEach(el => {
        el.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        
        el.addEventListener('mousemove', (e) => {
          const rect = el.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          const strength = 0.3; 
          
          el.style.transition = 'none';
          el.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
        });

        el.addEventListener('mouseleave', () => {
          el.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          el.style.transform = `translate(0px, 0px)`;
        });
        
        el.addEventListener('mouseenter', () => {
          el.style.transition = 'none';
        });
      });

      // ==========================================
      // 3. CV CURSOR FLOW EFFECT
      // ==========================================
      const cvDoc = document.getElementById("cvDoc");
      
      if (cvDoc) {
        cvDoc.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        
        cvDoc.addEventListener('mousemove', (e) => {
          const rect = cvDoc.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          
          const strength = 0.03; 
          
          cvDoc.style.transition = 'transform 0.1s ease-out';
          cvDoc.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
          cvDoc.style.boxShadow = '0 20px 40px rgba(0,0,0,0.08)';
        });

        cvDoc.addEventListener('mouseleave', () => {
          cvDoc.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.6s ease';
          cvDoc.style.transform = `translate(0px, 0px)`;
          cvDoc.style.boxShadow = '';
        });
        
        cvDoc.addEventListener('mouseenter', () => {
          cvDoc.style.transition = 'transform 0.1s ease-out';
        });
      }

    });
  </script>
</body>
</html>
