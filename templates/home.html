<section class="hero">
  <div class="container hero-inner">
    <div class="hero-text">
      <p class="eyebrow">{{ page.eyebrow }}</p>
      <h1>{{ page.heading }}</h1>
      <h2 class="hero-title">{{ page.subtitle }}</h2>
      <p class="hero-intro">{{ page.intro }}</p>
      <p class="hero-note">{{ page.note }}</p>
      <div class="hero-actions">
        {{ page.actions_html }}
      </div>
    </div>
    <div class="hero-card">
      <div class="profile-circle">{{ page.initials }}</div>
      <h3>{{ site.name }}</h3>
      <p class="profile-role">{{ page.role }}</p>
      <ul class="profile-meta">
        {{ page.meta_html }}
      </ul>
    </div>
  </div>
</section>
