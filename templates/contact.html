<section class="section page-section">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">{{ page.eyebrow }}</p>
      <h2>{{ page.heading }}</h2>
      <p class="section-sub">{{ page.subheading }}</p>
    </div>
    
    <!-- Existing Contact Cards -->
    <div class="contact-grid">
      {{ contact_cards }}
    </div>

    <!-- New Hiring Form -->
    <div style="margin-top: 4rem; padding-top: 3rem; border-top: 1px solid var(--border, #e5e5e0); max-width: 600px;">
      <h2 style="font-size: 1.5rem; margin-bottom: 1rem; color: var(--ink, #1a1a1a);">Send a Direct Message</h2>
      <p style="margin-bottom: 1.5rem; color: var(--ink-soft, #4a4a4a);">Interested in working together? Fill out the form below and I'll get back to you as soon as possible.</p>
      
      <form id="hireForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="text" id="hireName" placeholder="Your Name" required style="padding: 12px; border: 1px solid var(--border, #e5e5e0); border-radius: 6px; font-family: inherit;">
        <input type="email" id="hireEmail" placeholder="Your Email" required style="padding: 12px; border: 1px solid var(--border, #e5e5e0); border-radius: 6px; font-family: inherit;">
        <textarea id="hireMessage" placeholder="Your Message" rows="5" required style="padding: 12px; border: 1px solid var(--border, #e5e5e0); border-radius: 6px; font-family: inherit; resize: vertical;"></textarea>
        <button type="submit" class="btn btn-primary" style="align-self: flex-start; padding: 12px 24px; background: var(--green-700, #2d5a3d); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Send Message</button>
      </form>
      <p id="hireStatus" style="margin-top: 1rem; font-weight: bold; display: none;"></p>
    </div>
  </div>
</section>

<script>
  document.getElementById('hireForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const status = document.getElementById('hireStatus');
    status.innerText = 'Sending...';
    status.style.display = 'block';
    status.style.color = 'var(--ink-mute, #6b6b6b)';

    fetch('/api/hire', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('hireName').value,
        email: document.getElementById('hireEmail').value,
        message: document.getElementById('hireMessage').value
      })
    }).then(res => res.json()).then(data => {
      if (data.ok) {
        status.innerText = 'Message sent successfully! I will get back to you soon.';
        status.style.color = '#2d5a3d';
        document.getElementById('hireForm').reset();
      } else {
        status.innerText = 'Error: ' + data.error;
        status.style.color = 'red';
      }
    }).catch(err => {
      status.innerText = 'Network error. Please try again.';
      status.style.color = 'red';
    });
  });
</script>
